name: Monitor new upstream git release versions

on:
  workflow_dispatch:
  # Disabled: this repo depends on github.com/daeuniverse/quic-go (fork),
  # not github.com/quic-go/quic-go. Tracking upstream quic-go releases
  # produced non-actionable issues. Re-enable only after a conscious
  # migration plan for the daeuniverse fork.
  # schedule:
  #   - cron: "0 16 * * *"

env:
  CHARACTER_LIMIT: 1000
  MAX_AGE: 7d

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    strategy:
      matrix:
        include:
          # Track the module we actually import.
          - project: daeuniverse-quic-go
            labels: daeuniverse/quic-go
            feed: https://github.com/daeuniverse/quic-go/commits/master.atom
      fail-fast: false
    steps:
      - uses: git-for-windows/rss-to-issues@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          feed: ${{ matrix.feed }}
          prefix: "[New ${{ matrix.project }} commit]"
          character-limit: ${{ env.CHARACTER_LIMIT }}
          dry-run: false
          max-age: ${{ env.MAX_AGE }}
          labels: github/release,automated-issue,${{ matrix.labels }}
